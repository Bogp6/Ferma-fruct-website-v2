  - main [ref=f9e19]:
    - generic [ref=f9e22]:
      - heading "Politica de confidențialitate" [level=1] [ref=f9e23]
      - paragraph [ref=f9e24]: Aici explicăm, pe înțeles, ce se întâmplă cu datele pe care ni le trimiți prin formularul de contact.
      - paragraph [ref=f9e25]:
        - text: "Ultima actualizare:"
        - time [ref=f9e26]: 21 august 2026
    - generic [ref=f9e27]:
      - complementary "Pe scurt" [ref=f9e28]:
        - heading "Pe scurt" [level=2] [ref=f9e29]
        - paragraph [ref=f9e30]: Folosim datele din formular numai ca să îți răspundem. Nu le folosim pentru publicitate și nu le vindem.
        - link "Înapoi la contact" [ref=f9e31] [cursor=pointer]:
          - /url: contact.html
      - article [ref=f9e32]:
        - region [ref=f9e33]:
          - heading "1. Cine este operatorul datelor" [level=2] [ref=f9e34]
          - paragraph [ref=f9e35]:
            - text: Operatorul datelor cu caracter personal este
            - strong [ref=f9e36]: Agro Fin Tech
            - text: ", compania care administrează site-ul Ferma Fruct Brabova."
          - paragraph [ref=f9e37]:
            - text: Pentru întrebări privind confidențialitatea sau pentru exercitarea drepturilor tale, scrie la
            - link "nume@exemplu.ro" [ref=f9e38] [cursor=pointer]:
              - /url: mailto:nume@exemplu.ro
            - text: .
            - strong [ref=f9e39]: Aceasta este o adresă provizorie și trebuie înlocuită înainte de publicarea site-ului.
          - paragraph [ref=f9e40]: Agro Fin Tech nu a desemnat un responsabil cu protecția datelor, deoarece această desemnare nu este obligatorie pentru activitatea descrisă aici.
        - region [ref=f9e41]:
          - heading "2. Ce date colectăm" [level=2] [ref=f9e42]
          - paragraph [ref=f9e43]: "Prin formularul de contact colectăm datele introduse de tine: numele, numărul de telefon sau adresa de e-mail, subiectul opțional și conținutul mesajului. Formularul păstrează și confirmarea că ai bifat acordul privind prelucrarea datelor."
          - paragraph [ref=f9e44]: Te rugăm să nu trimiți prin mesaj date sensibile, cum ar fi date medicale, biometrice, informații despre conturi bancare sau documente de identitate.
          - paragraph [ref=f9e45]: Ca parte a funcționării obișnuite a site-ului, furnizorii tehnici pot prelucra și date precum adresa IP, data și ora accesării, tipul de browser și pagina solicitată.
        - region [ref=f9e46]:
          - heading "3. Scopul și temeiul legal" [level=2] [ref=f9e47]
          - paragraph [ref=f9e48]: Datele trimise prin formular sunt folosite numai pentru a analiza solicitarea ta și pentru a-ți răspunde. Temeiul legal este consimțământul tău, conform articolului 6 alineatul 1 litera a din Regulamentul general privind protecția datelor. Consimțământul este exprimat prin bifarea căsuței obligatorii din formular.
          - paragraph [ref=f9e49]: Îți poți retrage consimțământul oricând printr-un mesaj la adresa de e-mail de mai sus. Retragerea nu afectează legalitatea prelucrării efectuate înainte de retragere.
          - paragraph [ref=f9e50]: Prelucrarea tehnică strict necesară pentru livrarea și securizarea site-ului se bazează pe interesul legitim al Agro Fin Tech de a menține site-ul disponibil și sigur, conform articolului 6 alineatul 1 litera f.
        - region [ref=f9e51]:
          - heading "4. Cine poate vedea datele" [level=2] [ref=f9e52]
          - paragraph [ref=f9e53]: Mesajele pot fi văzute de persoanele autorizate din cadrul Agro Fin Tech care răspund solicitărilor și de furnizorul căsuței noastre de e-mail.
          - paragraph [ref=f9e54]:
            - text: Formularul folosește
            - strong [ref=f9e55]: Web3Forms
            - text: ", serviciu operat de Web3Creative, în calitate de persoană împuternicită. Datele formularului trec prin serverele Web3Forms înainte să ajungă în căsuța noastră de e-mail și pot fi prelucrate de subcontractanții tehnici autorizați de Web3Forms pentru găzduire, livrare de e-mail și filtrarea mesajelor nedorite."
          - paragraph [ref=f9e56]:
            - text: Poți citi
            - link "politica de confidențialitate Web3Forms , se deschide într-o filă nouă" [ref=f9e57] [cursor=pointer]:
              - /url: https://web3forms.com/privacy
              - text: politica de confidențialitate Web3Forms
              - generic [ref=f9e58]: ", se deschide într-o filă nouă"
            - text: și
            - link "acordul lor privind prelucrarea datelor , se deschide într-o filă nouă" [ref=f9e59] [cursor=pointer]:
              - /url: https://web3forms.com/dpa
              - text: acordul lor privind prelucrarea datelor
              - generic [ref=f9e60]: ", se deschide într-o filă nouă"
            - text: .
        - region [ref=f9e61]:
          - heading "5. Transferuri în afara Uniunii Europene" [level=2] [ref=f9e62]
          - paragraph [ref=f9e63]: Web3Creative operează din India, iar infrastructura Web3Forms poate prelucra date în afara Uniunii Europene și a Spațiului Economic European, inclusiv în Statele Unite. Conform acordului publicat de Web3Forms, transferurile pentru care este necesar un mecanism de protecție sunt acoperite de Clauzele Contractuale Standard aprobate de Comisia Europeană.
        - region [ref=f9e64]:
          - heading "6. Cât timp păstrăm mesajele" [level=2] [ref=f9e65]
          - paragraph [ref=f9e66]: Agro Fin Tech păstrează mesajul în căsuța de e-mail numai până când solicitarea este soluționată, apoi îl șterge, cu excepția cazului în care o obligație legală impune păstrarea lui pentru o perioadă mai lungă.
          - paragraph [ref=f9e67]: Separat, Web3Forms declară că datele trimiterilor pot fi păstrate în sistemul său timp de cel mult trei ani de la trimitere, în funcție de plan, sau pot fi șterse mai devreme. Această perioadă este stabilită de Web3Forms și este descrisă în politica și acordul lor de prelucrare.
        - region [ref=f9e68]:
          - heading "7. Drepturile tale" [level=2] [ref=f9e69]
          - paragraph [ref=f9e70]: "În condițiile prevăzute de Regulamentul general privind protecția datelor, ai următoarele drepturi:"
          - list [ref=f9e71]:
            - listitem [ref=f9e72]:
              - strong [ref=f9e73]: acces
              - text: la datele tale și la informații despre modul în care sunt prelucrate;
            - listitem [ref=f9e74]:
              - strong [ref=f9e75]: rectificare
              - text: ", dacă datele sunt incorecte sau incomplete;"
            - listitem [ref=f9e76]:
              - strong [ref=f9e77]: ștergere
              - text: ", atunci când condițiile legale sunt îndeplinite;"
            - listitem [ref=f9e78]:
              - strong [ref=f9e79]: restricționarea prelucrării
              - text: în situațiile prevăzute de lege;
            - listitem [ref=f9e80]:
              - strong [ref=f9e81]: opoziție
              - text: față de prelucrarea bazată pe interes legitim;
            - listitem [ref=f9e82]:
              - strong [ref=f9e83]: portabilitatea datelor
              - text: pe care ni le-ai furnizat, când prelucrarea se bazează pe consimțământ și se face prin mijloace automate.
          - paragraph [ref=f9e84]: Pentru a exercita un drept, trimite o cerere la adresa de e-mail indicată la secțiunea 1. În mod normal, vom răspunde în cel mult o lună.
        - region [ref=f9e85]:
          - heading "8. Dreptul de a depune o plângere" [level=2] [ref=f9e86]
          - paragraph [ref=f9e87]:
            - text: Dacă consideri că datele tale au fost prelucrate cu încălcarea legii, poți depune o plângere la Autoritatea Națională de Supraveghere a Prelucrării Datelor cu Caracter Personal, ANSPDCP. Informații și formularul de plângere sunt disponibile pe
            - link "site-ul ANSPDCP , se deschide într-o filă nouă" [ref=f9e88] [cursor=pointer]:
              - /url: https://www.dataprotection.ro/?page=Plangeri_RGPD&lang=ro
              - text: site-ul ANSPDCP
              - generic [ref=f9e89]: ", se deschide într-o filă nouă"
            - text: .
        - region [ref=f9e90]:
          - heading "9. Găzduire, analiză și module externe" [level=2] [ref=f9e91]
          - paragraph [ref=f9e92]: Site-ul este găzduit pe Cloudflare Pages. Ca parte a găzduirii web obișnuite, Cloudflare prelucrează adresele IP ale vizitatorilor și alte date tehnice necesare pentru livrarea și securizarea paginilor.
          - paragraph [ref=f9e93]: Site-ul folosește și Cloudflare Web Analytics, un instrument de analiză fără cookie-uri. Cloudflare declară că acesta nu folosește cookie-uri sau stocare locală, nu urmărește vizitatorii individuali și nu creează amprente digitale pe baza adresei IP, a browserului ori a altor identificatori.
          - paragraph [ref=f9e94]:
            - text: Site-ul nu setează cookie-uri proprii de publicitate sau de profilare. Pagina de contact include însă o hartă Google Maps încorporată. Atunci când harta este încărcată, Google poate prelucra adresa IP și alte date tehnice și poate folosi propriile tehnologii, conform
            - link "politicii de confidențialitate Google , se deschide într-o filă nouă" [ref=f9e95] [cursor=pointer]:
              - /url: https://policies.google.com/privacy?hl=ro
              - text: politicii de confidențialitate Google
              - generic [ref=f9e96]: ", se deschide într-o filă nouă"
            - text: .
        - region [ref=f9e97]:
          - heading "10. Decizii automate și actualizări" [level=2] [ref=f9e98]
          - paragraph [ref=f9e99]: Nu folosim datele din formular pentru decizii bazate exclusiv pe prelucrare automată și nu realizăm profiluri ale persoanelor care ne contactează.
          - paragraph [ref=f9e100]: Putem actualiza această politică dacă se schimbă formularul, furnizorii tehnici sau cerințele legale. Data ultimei versiuni este afișată în partea de sus a paginii.
