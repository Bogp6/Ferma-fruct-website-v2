<!-- ============================================================================
     SALVAGE — kept from the previous project at Bogdan's request.

     Bogdan liked the navbar and the button in the old build and wants them
     within easy reach here, so the markup is parked in this file rather than
     lost in git history. THIS FILE IS NOT A PAGE. Nothing loads it.

     To use a piece: copy the block into index.html, and take the matching CSS
     from salvage/salvage.css and, for the navbar, the JavaScript from
     salvage/salvage.js.

     The copy is Romanian and is the real copy from the old site, not
     placeholder. The four nav links point at pages that do not exist yet.
     ============================================================================ -->


<!-- ---------------------------------------------------------------------------
     1. HERO PHOTO
     The picture Bogdan is keeping. Four sizes are already in img/.

     A real <img>, never a CSS background: a background cannot carry
     fetchpriority, so the browser would find it late and the page would open
     on an empty band. Never put loading="lazy" on this one; it is the first
     thing on the screen and lazy would delay the only image that matters.
     width and height are the real pixel size of the largest file and are what
     stop the page jumping as it loads.
     --------------------------------------------------------------------------- -->

<picture class="hero__media">
  <img class="hero__photo"
       src="img/hero-1280.webp"
       srcset="img/hero-640.webp   640w,
               img/hero-960.webp   960w,
               img/hero-1280.webp 1280w,
               img/hero-1677.webp 1677w"
       sizes="100vw"
       width="1677" height="938"
       fetchpriority="high"
       alt="Livadă de pomi fructiferi cu drum de pământ care duce spre hala fermei">
</picture>


<!-- ---------------------------------------------------------------------------
     2. NAVBAR
     Bogdan liked this one and asked for it to be carried over.

     Goes directly inside <body>, before <main>. Needs section 2 of
     salvage.css and salvage.js.

     Three zones on a 1fr auto 1fr grid, so the navigation stays optically
     centred however wide the wordmark grows.
     --------------------------------------------------------------------------- -->

<header class="site-header">
  <div class="site-header__inner">

    <a class="brand" href="index.html" aria-label="Ferma Fruct Brabova, pagina principală">
      <!-- aria-hidden because the readable name is already on the link above.
           Without it a screen reader says the name twice. -->
      <span class="brand__word" aria-hidden="true"><span class="brand__f">F</span>erma <span
          class="brand__f">F</span>ruct</span>
    </a>

    <nav class="nav" aria-label="Navigare principală">
      <ul class="nav__list">
        <li><a class="nav__link" href="index.html" aria-current="page">Acasă</a></li>
        <li><a class="nav__link" href="despre.html">Despre</a></li>
        <li><a class="nav__link" href="fructe.html">Fructe</a></li>
        <li><a class="nav__link" href="contact.html">Contact</a></li>
      </ul>
    </nav>

    <!-- Selectorul de limbă: româna este singura limbă publicată acum. Engleza
         se adaugă la final, atunci „EN" devine un <a href>. Rămâne <span> cât
         timp pagina engleză nu există: nimic nu trimite către o pagină care nu
         există. -->
    <p class="lang">
      <span class="visually-hidden">Limba paginii:</span>
      <span class="lang__current">RO</span>
      <span class="lang__soon">EN</span>
    </p>

  </div>
</header>
