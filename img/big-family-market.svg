<svg xmlns="http://www.w3.org/2000/svg" width="403" height="485" viewBox="0 0 403 485">
  <title>BIG FAMILY MARKET transparent SVG</title>
  <defs>
    <style>
      .blue { fill: #0b19ff; }
      .black { fill: #000000; }
      .orange { fill: #ff6501; }
      .heavy { font-family: Arial, Helvetica, sans-serif; font-weight: 900; }
      .bold { font-family: Arial, Helvetica, sans-serif; font-weight: 800; }
    </style>
  </defs>

  <!-- Main badge -->
  <circle cx="201.5" cy="188" r="155" fill="none" stroke="#ff6501" stroke-width="3.5"/>
  <circle cx="201.5" cy="188" r="170" fill="none" stroke="#ffffff" stroke-width="2.5"/>
  <circle cx="201.5" cy="188" r="173.5" fill="none" stroke="#ff6501" stroke-width="2"/>

  <!-- Top shopping icon -->
  <circle cx="202" cy="83" r="30" class="orange"/>
  <g transform="translate(176 60) scale(1.0)" fill="none" stroke="#ffffff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M5 8 H14 L18 25 H39"/>
    <path d="M16 12 H40 L36 24 H19"/>
    <path d="M22 12 L24 24 M28 12 L29 24 M34 12 L33 24"/>
    <path d="M18 16 H39 M19 20 H38"/>
    <circle cx="22" cy="31" r="2.3" fill="#ffffff" stroke="none"/>
    <circle cx="35" cy="31" r="2.3" fill="#ffffff" stroke="none"/>
  </g>

  <!-- Text -->
  <text x="82" y="176" class="blue heavy" font-size="81" letter-spacing="0">BIG</text>
  <text x="110" y="231" class="black heavy" font-size="53" letter-spacing="0">FAMILY</text>
  <text x="110" y="267" class="blue heavy" font-size="45" letter-spacing="0">MARKET</text>

  <!-- Orange swoosh -->
  <path d="M138 290 C164 317, 229 322, 269 288" fill="none" stroke="#ff6501" stroke-width="8" stroke-linecap="round"/>
</svg>
